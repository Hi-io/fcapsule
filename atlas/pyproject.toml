[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fcapsule-atlas-service"
version = "0.1.0"
description = "Durable knowledge API for FCAPSule incident evidence"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "psycopg[binary]>=3.2,<4",
  "uvicorn[standard]>=0.30,<1",
]

[tool.setuptools]
packages = ["atlas"]
package-dir = { atlas = "." }

[tool.setuptools.package-data]
atlas = ["migrations/*.sql"]
