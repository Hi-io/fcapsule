name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check frontend and helper regressions
        run: |
          node --check fcapsule/ui/assets/app.js
          node --test tests/ui_*.test.cjs

  atlas-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: atlas
          POSTGRES_PASSWORD: atlas_test
          POSTGRES_DB: atlas_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U atlas -d atlas_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ATLAS_TEST_DATABASE_URL: postgresql://atlas:atlas_test@127.0.0.1:5432/atlas_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Atlas test dependencies
        run: python -m pip install -r atlas/requirements-dev.txt
      - name: Run Atlas tests
        run: python -m unittest discover -s atlas/tests -v
