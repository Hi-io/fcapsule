# Optional: create the fcapsule-tls Secret before applying this file and the patch.
apiVersion: v1
kind: ConfigMap
metadata:
  name: fcapsule-https
  namespace: fcapsule
data:
  Caddyfile: |
    {
        admin off
        auto_https off
    }
    :8443 {
        tls /etc/fcapsule-tls/tls.crt /etc/fcapsule-tls/tls.key
        reverse_proxy 127.0.0.1:8765
    }
---
apiVersion: v1
kind: Service
metadata:
  name: fcapsule-https
  namespace: fcapsule
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: fcapsule
  ports:
    - name: https
      port: 8443
      targetPort: https
      nodePort: 30767
