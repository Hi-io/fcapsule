apiVersion: v1
kind: Namespace
metadata:
  name: fcapsule
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: fcapsule
  namespace: fcapsule
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: fcapsule-observer
rules:
  - apiGroups: [""]
    resources: ["pods", "configmaps", "namespaces", "services"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: fcapsule-observer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: fcapsule-observer
subjects:
  - kind: ServiceAccount
    name: fcapsule
    namespace: fcapsule
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: fcapsule-state
  namespace: fcapsule
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: manual
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fcapsule
  namespace: fcapsule
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: fcapsule
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fcapsule
    spec:
      serviceAccountName: fcapsule
      securityContext:
        fsGroup: 1000
      initContainers:
        - name: prepare-state
          image: busybox:1.36
          command: ["sh", "-c", "chgrp -R 1000 /var/lib/fcapsule && chmod -R g+rwX /var/lib/fcapsule"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              add: ["CHOWN", "FOWNER"]
            runAsNonRoot: false
            runAsUser: 0
          volumeMounts:
            - name: state
              mountPath: /var/lib/fcapsule
      containers:
        - name: fcapsule
          image: ghcr.io/hi-io/fcapsule:latest
          imagePullPolicy: Always
          args: ["--host", "0.0.0.0", "--port", "8765", "--state-dir", "/var/lib/fcapsule"]
          envFrom:
            - configMapRef:
                name: fcapsule-runtime
            - secretRef:
                name: fcapsule-secrets
                optional: true
          ports:
            - name: http
              containerPort: 8765
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 15
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: state
              mountPath: /var/lib/fcapsule
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: state
          persistentVolumeClaim:
            claimName: fcapsule-state
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: fcapsule-runtime
  namespace: fcapsule
data:
  FCAPSULE_LIVE_ENABLED: "true"
  FCAPSULE_CLUSTER_NAME: "go15"
  FCAPSULE_ENVIRONMENT: "development"
  FCAPSULE_NAMESPACES: "default"
  FCAPSULE_PROMETHEUS_URL: "http://prometheus-kube-prometheus-prometheus.monitoring.svc.cluster.local:9090"
  FCAPSULE_OPENSEARCH_URL: "http://opensearch.logging.svc.cluster.local:9200"
  FCAPSULE_OPENSEARCH_INDEX: "k8s-logs-*"
  FCAPSULE_POLL_INTERVAL_SECONDS: "30"
  FCAPSULE_INCIDENT_WINDOW_MINUTES: "10"
  FCAPSULE_AUTO_BUILD_REPORTS: "true"
---
apiVersion: v1
kind: Service
metadata:
  name: fcapsule
  namespace: fcapsule
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: fcapsule
  ports:
    - name: http
      port: 8765
      targetPort: http
      nodePort: 30765
