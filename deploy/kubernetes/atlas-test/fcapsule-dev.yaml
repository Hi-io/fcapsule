apiVersion: v1
kind: Service
metadata:
  name: fcapsule-dev-a
  labels:
    app.kubernetes.io/part-of: fcapsule-atlas-test
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: fcapsule
    app.kubernetes.io/instance: dev-a
  ports:
    - name: http
      port: 8765
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: fcapsule-dev-b
  labels:
    app.kubernetes.io/part-of: fcapsule-atlas-test
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: fcapsule
    app.kubernetes.io/instance: dev-b
  ports:
    - name: http
      port: 8765
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fcapsule-dev-a
  labels:
    app.kubernetes.io/name: fcapsule
    app.kubernetes.io/instance: dev-a
    app.kubernetes.io/part-of: fcapsule-atlas-test
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: fcapsule
      app.kubernetes.io/instance: dev-a
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fcapsule
        app.kubernetes.io/instance: dev-a
        app.kubernetes.io/part-of: fcapsule-atlas-test
    spec:
      nodeSelector:
        kubernetes.io/hostname: worker-1
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      initContainers:
        - name: prepare-state
          image: busybox:1.36
          command: ["sh", "-c", "chgrp -R 1000 /var/lib/fcapsule && chmod -R g+rwX /var/lib/fcapsule"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              add: ["CHOWN", "FOWNER"]
            runAsNonRoot: false
            runAsUser: 0
          resources:
            requests:
              cpu: 20m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          volumeMounts:
            - name: state
              mountPath: /var/lib/fcapsule
        - name: install-source
          image: python:3.12-slim
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -ec
            - >-
              python -m pip install --no-cache-dir --target /opt/fcapsule
              "https://github.com/Hi-io/fcapsule/archive/${FCAPSULE_SOURCE_REF}.zip"
          envFrom:
            - configMapRef:
                name: fcapsule-atlas-test-runtime
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 384Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: source
              mountPath: /opt/fcapsule
            - name: tmp
              mountPath: /tmp
      containers:
        - name: fcapsule
          image: python:3.12-slim
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "fcapsule.cli", "serve"]
          args: ["--host", "0.0.0.0", "--port", "8765", "--state-dir", "/var/lib/fcapsule"]
          envFrom:
            - configMapRef:
                name: fcapsule-atlas-test-runtime
          env:
            - name: PYTHONPATH
              value: /opt/fcapsule
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
            - name: FCAPSULE_ATLAS_INSTANCE_ID
              value: atlas-dev-a
            - name: FCAPSULE_ATLAS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: fcapsule-atlas-runtime
                  key: ATLAS_API_TOKEN
          ports:
            - name: http
              containerPort: 8765
          startupProbe:
            exec:
              command: ["python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/healthz', timeout=2)"]
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            exec:
              command: ["python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/healthz', timeout=2)"]
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            exec:
              command: ["python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/healthz', timeout=2)"]
            initialDelaySeconds: 20
            periodSeconds: 15
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: state
              mountPath: /var/lib/fcapsule
            - name: source
              mountPath: /opt/fcapsule
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: state
          persistentVolumeClaim:
            claimName: fcapsule-dev-a-state
        - name: source
          emptyDir:
            sizeLimit: 512Mi
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
---
