apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: fcapsule-atlas-test-local
provisioner: kubernetes.io/no-provisioner
volumeBindingMode: WaitForFirstConsumer
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: atlas-test-postgres
  labels:
    app.kubernetes.io/part-of: fcapsule-atlas-test
spec:
  capacity:
    storage: 2Gi
  volumeMode: Filesystem
  accessModes: [ReadWriteOnce]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: fcapsule-atlas-test-local
  hostPath:
    path: /var/lib/fcapsule-atlas-test/postgres
    type: DirectoryOrCreate
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values: [worker-1]
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: fcapsule-atlas-test-state-a
  labels:
    app.kubernetes.io/part-of: fcapsule-atlas-test
spec:
  capacity:
    storage: 1Gi
  volumeMode: Filesystem
  accessModes: [ReadWriteOnce]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: fcapsule-atlas-test-local
  hostPath:
    path: /var/lib/fcapsule-atlas-test/fcapsule-a
    type: DirectoryOrCreate
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values: [worker-1]
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: fcapsule-atlas-test-state-b
  labels:
    app.kubernetes.io/part-of: fcapsule-atlas-test
spec:
  capacity:
    storage: 1Gi
  volumeMode: Filesystem
  accessModes: [ReadWriteOnce]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: fcapsule-atlas-test-local
  hostPath:
    path: /var/lib/fcapsule-atlas-test/fcapsule-b
    type: DirectoryOrCreate
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values: [worker-1]
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: atlas-postgres-data
  labels:
    app.kubernetes.io/part-of: fcapsule-atlas-test
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: fcapsule-atlas-test-local
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: fcapsule-dev-a-state
  labels:
    app.kubernetes.io/part-of: fcapsule-atlas-test
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: fcapsule-atlas-test-local
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: fcapsule-dev-b-state
  labels:
    app.kubernetes.io/part-of: fcapsule-atlas-test
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: fcapsule-atlas-test-local
  resources:
    requests:
      storage: 1Gi
