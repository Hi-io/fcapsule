[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fcapsule-ai"
version = "1.0.0"
description = "Evidence capsules for production incident investigation after telemetry expires"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0"]

[project.scripts]
fcapsule = "fcapsule.cli:main"

[project.urls]
Homepage = "https://github.com/Hi-io/fcapsule"
Repository = "https://github.com/Hi-io/fcapsule"
Issues = "https://github.com/Hi-io/fcapsule/issues"

[tool.setuptools.packages.find]
include = ["fcapsule*"]
