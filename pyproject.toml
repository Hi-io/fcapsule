[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fcapsule-ai"
version = "1.0.0"
description = "A telemetry attention and incident evidence retention engine"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0"]

[project.scripts]
fcapsule = "fcapsule.cli:main"

[tool.setuptools.packages.find]
include = ["fcapsule*"]
